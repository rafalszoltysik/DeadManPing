<svg width="1500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient tła głównego - ciemne kolory z globals.css -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121214;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#18181A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#18181A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient dla efektów świetlnych - subtelne akcenty primary -->
    <radialGradient id="glow1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="glow2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="glow3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:0" />
    </radialGradient>
    
    <!-- Wzór siatki (subtle pattern) - ciemniejszy -->
    <pattern id="gridPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z" 
            fill="#000000" fill-opacity="0.03" />
    </pattern>
    
    <!-- Efekt blura dla kół -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>
    
    <!-- Gradient dla tekstu -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F4F4F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cień dla tekstu -->
    <filter id="textShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tło główne z gradientem - ciemne -->
  <rect width="1500" height="500" fill="url(#bgGradient)"/>
  
  <!-- Efekty świetlne - bardzo subtelne -->
  <ellipse cx="300" cy="150" rx="250" ry="200" fill="url(#glow1)"/>
  <ellipse cx="1200" cy="350" rx="300" ry="250" fill="url(#glow2)"/>
  <ellipse cx="750" cy="250" rx="400" ry="300" fill="url(#glow3)"/>
  
  <!-- Wzór siatki -->
  <rect width="1500" height="500" fill="url(#gridPattern)"/>
  
  <!-- Dekoracyjne kółka z efektem blur - bardzo subtelne -->
  <circle cx="200" cy="100" r="80" fill="#14B8A6" fill-opacity="0.04" filter="url(#blur)"/>
  <circle cx="1300" cy="400" r="100" fill="#14B8A6" fill-opacity="0.03" filter="url(#blur)"/>
  <circle cx="1100" cy="150" r="60" fill="#14B8A6" fill-opacity="0.05" filter="url(#blur)"/>
  <circle cx="400" cy="400" r="70" fill="#14B8A6" fill-opacity="0.04" filter="url(#blur)"/>
  
  <!-- Linie dekoracyjne - bardzo subtelne -->
  <path d="M 0 250 Q 375 200, 750 250 T 1500 250" 
        stroke="#14B8A6" 
        stroke-width="1" 
        fill="none" 
        opacity="0.08" 
        stroke-linecap="round"/>
  
  <path d="M 0 300 Q 500 350, 1000 300 T 1500 300" 
        stroke="#14B8A6" 
        stroke-width="0.8" 
        fill="none" 
        opacity="0.06" 
        stroke-linecap="round"/>
  
  <!-- Tekst główny - DeadManPing -->
  <text x="750" y="220" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="72" 
        font-weight="700" 
        text-anchor="middle" 
        fill="url(#textGradient)"
        filter="url(#textShadow)"
        letter-spacing="-0.02em">
    DeadManPing
  </text>
  
  <!-- Podtytuł -->
  <text x="750" y="270" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="32" 
        font-weight="600" 
        text-anchor="middle" 
        fill="#F4F4F5"
        opacity="0.95"
        letter-spacing="0.01em">
    Never Miss a Cron Job Again
  </text>
  
  <!-- Tagline -->
  <text x="750" y="310" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="22" 
        font-weight="400" 
        text-anchor="middle" 
        fill="#A1A1AA"
        opacity="0.9"
        letter-spacing="0.02em">
    Monitor outcomes, not just execution.
  </text>
</svg>

